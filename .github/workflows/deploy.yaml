name: Deploy
on:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install root dependencies
        run: npm ci
      - name: Install function dependencies
        run: npm ci
        working-directory: ./functions
      - name: Build SPA
        run: npm run build
        env:
          # Same-origin: the Worker serves the SPA, so the API is reached at /update etc.
          # Secret names are unchanged (REACT_APP_*) from the pre-Vite setup;
          # only the build-time env var names moved to Vite's VITE_ prefix.
          VITE_API_URL: ""
          VITE_APP_URL: ${{ secrets.REACT_APP_APP_URL }}
          VITE_BM_CLIENT_ID: ${{ secrets.REACT_APP_BM_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.REACT_APP_SENTRY_DSN }}
      - name: Deploy Worker (SPA assets + API + cron)
        run: npx wrangler deploy
        working-directory: ./functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
